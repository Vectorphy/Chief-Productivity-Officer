name: CI - Test & Quality Suite

on:
  push:
    branches: [ "master", "vector-commits", "cpo-next" ]
  pull_request:
    branches: [ "master", "vector-commits" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Static Type Checking (mypy)
      run: |
        mypy bot.py database.py utils.py cogs/ tests/

    - name: Linting & Complexity Check (ruff)
      run: |
        ruff check bot.py database.py utils.py cogs/ tests/

    - name: Format Verification (ruff format)
      run: |
        ruff format --check bot.py database.py utils.py cogs/ tests/ || echo "Formatting check note: some lines can be auto-formatted with 'ruff format .'"

    - name: Run Pytest Suite
      run: |
        pytest -v --cov=. --cov-report=xml --cov-report=term-missing

    - name: Upload Test Coverage
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-py312
        path: coverage.xml
        if-no-files-found: ignore
